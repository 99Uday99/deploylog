name: Build and Deploy

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: 'file:./dev.db'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Chromium
        uses: browser-actions/setup-chrome@latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize Database
        run: npx prisma db push

      - name: Build Next.js App
        run: npm run build

      - name: Start DeployLog Server
        run: |
          npm start &
          npx wait-on http://localhost:3000

      - name: Create Deployment Record
        id: create_deployment
        # Using a separate step to capture ID safely
        run: |
          API_URL="${{ secrets.API_URL || 'http://localhost:3000' }}"
          RESPONSE=$(curl -X POST "$API_URL/api/deployments" \
            -H "Content-Type: application/json" \
            -d '{
              "projectName": "DeployLog",
              "branch": "${{ github.ref_name }}",
              "commitHash": "${{ github.sha }}",
              "commitMessage": "CI Pipeline Execution",
              "status": "queued"
            }')
          echo "DEPLOYMENT_ID=$(echo $RESPONSE | jq -r .id)" >> $GITHUB_OUTPUT

      - name: Update Status (Linting)
        run: |
          API_URL="${{ secrets.API_URL || 'http://localhost:3000' }}"
          curl -X PATCH "$API_URL/api/deployments/${{ steps.create_deployment.outputs.DEPLOYMENT_ID }}" \
            -H "Content-Type: application/json" \
            -d '{"status": "linting"}'

      - name: Report Linting Start
        run: |
          API_URL="${{ secrets.API_URL || 'http://localhost:3000' }}"
          curl -X POST "$API_URL/api/deployments/${{ steps.create_deployment.outputs.DEPLOYMENT_ID }}/stages" \
            -H "Content-Type: application/json" \
            -d '{"name": "Lint", "status": "running"}'

      - name: Lint
        run: npm run lint

      - name: Check Formatting
        run: npx prettier --check .

      - name: Report Linting Success
        if: success()
        run: |
          API_URL="${{ secrets.API_URL || 'http://localhost:3000' }}"
          curl -X POST "$API_URL/api/deployments/${{ steps.create_deployment.outputs.DEPLOYMENT_ID }}/stages" \
            -H "Content-Type: application/json" \
            -d '{"name": "Lint", "status": "success"}'

      - name: Report Linting Failure
        if: failure()
        run: |
          API_URL="${{ secrets.API_URL || 'http://localhost:3000' }}"
          curl -X POST "$API_URL/api/deployments/${{ steps.create_deployment.outputs.DEPLOYMENT_ID }}/stages" \
            -H "Content-Type: application/json" \
            -d '{"name": "Lint", "status": "failed"}'

      - name: Update Status (Testing)
        run: |
          API_URL="${{ secrets.API_URL || 'http://localhost:3000' }}"
          curl -X PATCH "$API_URL/api/deployments/${{ steps.create_deployment.outputs.DEPLOYMENT_ID }}" \
            -H "Content-Type: application/json" \
            -d '{"status": "testing"}'

      - name: Report Testing Start
        run: |
          API_URL="${{ secrets.API_URL || 'http://localhost:3000' }}"
          curl -X POST "$API_URL/api/deployments/${{ steps.create_deployment.outputs.DEPLOYMENT_ID }}/stages" \
            -H "Content-Type: application/json" \
            -d '{"name": "Test", "status": "running"}'

      - name: Run Unit Tests
        run: npm run test

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Report Testing Success
        if: success()
        run: |
          API_URL="${{ secrets.API_URL || 'http://localhost:3000' }}"
          curl -X POST "$API_URL/api/deployments/${{ steps.create_deployment.outputs.DEPLOYMENT_ID }}/stages" \
            -H "Content-Type: application/json" \
            -d '{"name": "Test", "status": "success"}'

      - name: Report Testing Failure
        if: failure()
        run: |
          API_URL="${{ secrets.API_URL || 'http://localhost:3000' }}"
          curl -X POST "$API_URL/api/deployments/${{ steps.create_deployment.outputs.DEPLOYMENT_ID }}/stages" \
            -H "Content-Type: application/json" \
            -d '{"name": "Test", "status": "failed"}'

      - name: Update Status (Building)
        run: |
          API_URL="${{ secrets.API_URL || 'http://localhost:3000' }}"
          curl -X PATCH "$API_URL/api/deployments/${{ steps.create_deployment.outputs.DEPLOYMENT_ID }}" \
            -H "Content-Type: application/json" \
            -d '{"status": "building"}'

      - name: Report Building Start
        run: |
          API_URL="${{ secrets.API_URL || 'http://localhost:3000' }}"
          curl -X POST "$API_URL/api/deployments/${{ steps.create_deployment.outputs.DEPLOYMENT_ID }}/stages" \
            -H "Content-Type: application/json" \
            -d '{"name": "Build", "status": "running"}'

      - name: Build Docker Image
        run: docker build -t deploylog:latest .

      - name: Report Building Success
        if: success()
        run: |
          API_URL="${{ secrets.API_URL || 'http://localhost:3000' }}"
          curl -X POST "$API_URL/api/deployments/${{ steps.create_deployment.outputs.DEPLOYMENT_ID }}/stages" \
            -H "Content-Type: application/json" \
            -d '{"name": "Build", "status": "success"}'

      - name: Report Building Failure
        if: failure()
        run: |
          API_URL="${{ secrets.API_URL || 'http://localhost:3000' }}"
          curl -X POST "$API_URL/api/deployments/${{ steps.create_deployment.outputs.DEPLOYMENT_ID }}/stages" \
            -H "Content-Type: application/json" \
            -d '{"name": "Build", "status": "failed"}'

      - name: Update Deployment Status (Success)
        if: success()
        run: |
          API_URL="${{ secrets.API_URL || 'http://localhost:3000' }}"
          curl -X PATCH "$API_URL/api/deployments/${{ steps.create_deployment.outputs.DEPLOYMENT_ID }}" \
            -H "Content-Type: application/json" \
            -d '{"status": "success", "logs": "Pipeline completed successfully. \n- Linting: Passed \n- Tests: Passed \n- Docker Build: Passed"}'

      - name: Update Deployment Status (Failure)
        if: failure() && steps.create_deployment.outputs.DEPLOYMENT_ID
        run: |
          API_URL="${{ secrets.API_URL || 'http://localhost:3000' }}"
          curl -X PATCH "$API_URL/api/deployments/${{ steps.create_deployment.outputs.DEPLOYMENT_ID }}" \
            -H "Content-Type: application/json" \
            -d '{"status": "failed", "logs": "Pipeline failed. Check GitHub Actions logs for details."}'
